name: Deploy ConnectLAW Frontend to GitHub Pages

# Deployt den Ordner docs/ direkt als statische Seite (OHNE Jekyll).
# Dadurch wird docs/index.html als Startseite ausgeliefert – nicht der
# gerenderte README/Prompt (jekyll-readme-index wird umgangen).

on:
  push:
    branches:
      - main
      - claude/stoic-feynman-IFHsj
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein gleichzeitiges Deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
